<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPIKE Prime × ESP32 Smart Delivery Rover</title><style>body{margin:0;display:grid;place-items:center;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fa;color:#191f28}.box{text-align:center}.dot{width:12px;height:12px;margin:18px auto;border-radius:50%;background:#3182f6;animation:p 1s infinite alternate}@keyframes p{to{transform:scale(1.7);opacity:.35}}</style></head><body><div class="box"><strong>SPIKE Prime × ESP32</strong><div class="dot"></div><small>프로젝트 가이드를 불러오는 중입니다.</small></div><script>const files=Array.from({length:7},(_,i)=>`page-parts/part${i+1}.txt`);Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()}))).then(parts=>{document.open();document.write(parts.join(''));document.close()}).catch(e=>{document.body.innerHTML='<div class="box"><strong>페이지 로드 오류</strong><p>'+e.message+'</p></div>';console.error(e)})</script></body></html>
